name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Usar assinatura de teste
        run: |
          sed -i 's/signingConfigs.getByName("release")/signingConfigs.getByName("debug")/g' app/build.gradle.kts
          grep -n getByName app/build.gradle.kts
      - run: chmod +x gradlew && ./gradlew :app:assembleFullDebug
      - uses: actions/upload-artifact@v4
        with:
          name: nuvio-tv-apk
          path: app/build/outputs/apk/**/*.apk
