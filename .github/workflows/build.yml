name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Usar minha chave fixa
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
          K_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p ~/.android
          echo "$KS_B64" | base64 -d > nuvio.jks
          rm -f ~/.android/debug.keystore
          keytool -importkeystore -noprompt \
            -srckeystore nuvio.jks -srcstorepass "$KS_PASS" \
            -srcalias "$KS_ALIAS" -srckeypass "$K_PASS" \
            -destkeystore ~/.android/debug.keystore -deststoretype PKCS12 \
            -deststorepass android -destkeypass android \
            -destalias androiddebugkey
      - name: Usar assinatura de teste
        run: |
          sed -i 's/signingConfigs.getByName("release")/signingConfigs.getByName("debug")/g' app/build.gradle.kts
          grep -n getByName app/build.gradle.kts
      - name: Aumentar capas da busca
        run: |
          F=app/src/main/java/com/nuvio/tv/ui/screens/search/SearchScreen.kt
          sed -i 's/^\(\s*\)PosterCardStyle(\s*$/\1PosterCardStyle(\n\1    width = PosterCardStyle().width * 1.35f,\n\1    height = PosterCardStyle().height * 1.35f,/' $F
          grep -n -A3 "PosterCardStyle($" $F
          grep -q "1.35f" $F
      - run: chmod +x gradlew && ./gradlew :app:assembleFullDebug
      - uses: actions/upload-artifact@v4
        with:
          name: nuvio-tv-apk
          path: app/build/outputs/apk/**/*.apk
